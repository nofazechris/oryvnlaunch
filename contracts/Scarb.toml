[package]
name = "oryvn_contracts"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.21.0"
description = "oryvnlaunch: non-custodial token factory and bonding curve for Starknet"

[dependencies]
starknet = "2.21.0"
openzeppelin_token = "4.0.1"
openzeppelin_access = "4.0.1"
openzeppelin_security = "4.0.1"
openzeppelin_interfaces = "2.2.0"

[dev-dependencies]
snforge_std = "0.64.1"
assert_macros = "2.21.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Used only by `snforge test --coverage -P coverage`. It adds the debug information the coverage tool
# needs and turns inlining off so line numbers stay meaningful. The dev and release builds, which are
# the ones that get deployed, are not affected.
[profile.coverage]
inherits = "dev"

[profile.coverage.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"
